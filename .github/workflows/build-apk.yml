# Builds Shardrip.apk (Android), tests it on a real Android emulator, and makes it downloadable.
#   - Every push: the .apk appears under the "Actions" tab -> the run -> "Artifacts".
#   - Publish a release: the .apk is built, tested and attached to the release automatically.
# Signing: uses the SHARDRIP_KEYSTORE_B64 repository secret if it's set (so updates install over
# the old version). Without it, a temporary key is used (installs fine, but updating needs an uninstall).
name: Build Shardrip.apk

on:
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.SHARDRIP_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/shardrip.jks"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$KS"
            echo "Signing with the Shardrip key from the repository secret."
          else
            keytool -genkeypair -keystore "$KS" -alias shardrip -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass shardrip -keypass shardrip -dname "CN=Shardrip (temporary key)"
            echo "::warning::No SHARDRIP_KEYSTORE_B64 secret - signed with a temporary key. Installs fine; updating will need an uninstall first."
          fi
          echo "SHARDRIP_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "SHARDRIP_KEYSTORE_PASSWORD=shardrip" >> "$GITHUB_ENV"
          echo "SHARDRIP_BUILD_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Build the emulator test copy (x86_64)
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace assembleRelease -Pabis=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../Shardrip-x86_64-test.apk

      - name: Build Shardrip.apk (phones - 64-bit ARM)
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Shardrip.apk
          sha256sum ../Shardrip.apk | cut -d' ' -f1 | tee ../Shardrip.apk.sha256.txt
          ls -l ../Shardrip.apk

      - name: Start a sender on this machine (for the test)
        run: |
          python -m pip install requests cryptography pillow
          head -c 150000000 /dev/urandom > ci-test.bin
          sha256sum ci-test.bin | cut -d' ' -f1 > ci-test.sha
          nohup python shardrip.py --serve ci-test.bin --password ci-pass-123 --no-tunnel --no-qr --port 8099 > serve.log 2>&1 &
          for i in $(seq 1 30); do grep -q "Same network" serve.log && break; sleep 1; done
          cat serve.log
          # the emulator reaches this machine at 10.0.2.2
          grep -A1 "Same network (LAN)" serve.log | tail -1 | sed -E 's#http://[0-9.]+:#http://10.0.2.2:#; s/^ +//' > link.txt
          cat link.txt

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/ci-emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shardrip-apk
          path: |
            Shardrip.apk
            Shardrip.apk.sha256.txt
            ci-out/

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Shardrip.apk
            Shardrip.apk.sha256.txt
